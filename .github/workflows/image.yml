name: Container

on:
  pull_request:
    paths:
      - ".github/workflows/image.yml"
      - "Dockerfile"
      - "requirements/pascal.*"
      - "run_server.py"
      - "tests/**"
      - "third_party/**"
      - "whisper_live/**"
  push:
    branches:
      - main
      - codex/pascal-sm61
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pascalscribe

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: pascalscribe:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm pascalscribe:test

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=1080ti
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
