<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0d0d">
    <title>PascalScribe</title>
    <link rel="stylesheet" href="/ui/styles.css">
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="status-dot" id="statusDot"></span>
          <strong>PascalScribe</strong>
        </div>

        <button class="nav-item selected" id="liveNav" type="button">
          <span>Live</span>
          <small id="liveState">Idle</small>
        </button>

        <div class="history-heading">
          <span>Logs</span>
          <button id="refreshHistory" type="button" aria-label="Refresh logs">↻</button>
        </div>
        <nav class="history-list" id="historyList" aria-label="Saved transcripts"></nav>
      </aside>

      <main>
        <header class="topbar">
          <div class="view-name">
            <h1 id="viewTitle">Live</h1>
            <span id="serverStatus">Connecting</span>
          </div>

          <div class="actions">
            <dl class="gpu-stats" aria-label="GPU telemetry">
              <div>
                <dt>Power</dt>
                <dd id="gpuPowerValue">—</dd>
              </div>
              <div>
                <dt>Memory</dt>
                <dd id="gpuMemoryValue">—</dd>
              </div>
            </dl>

            <label class="speaker-toggle">
              <input id="diarizationToggle" type="checkbox" checked>
              <span>Speakers</span>
            </label>
            <button class="secondary-button" id="copyButton" type="button" disabled>
              Copy
            </button>
            <button class="record-button" id="recordButton" type="button" disabled>
              <span class="record-dot"></span>
              <span id="recordLabel">Start</span>
            </button>
          </div>
        </header>

        <div class="error" id="errorBanner" role="alert" hidden></div>

        <section class="transcript" id="transcriptScroll" aria-label="Transcript">
          <p class="empty" id="emptyState">No transcript</p>
          <ol class="segments" id="segmentsList" aria-live="polite"></ol>
          <div class="partial" id="partialCard" hidden>
            <span></span>
            <p id="partialText"></p>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
